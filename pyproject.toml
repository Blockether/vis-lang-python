[project]
name = "vis-lang-python"
version = "1.3.2"
description = "Python tools for Vis: ruff formatting and lint, pytest runs and a managed project REPL."
requires-python = ">=3.11"
dependencies = [
  "vis-agent>=0.2.26",
  "vis-lang-interface @ git+https://github.com/Blockether/vis-lang-interface@v2.1.2",
  "ruff>=0.14",
]

[tool.vis]
category = "tools"
source_paths = ["src"]

[tool.ruff]
# The README aligns its examples for people to read; ruff must not reflow them.
extend-exclude = ["*.md"]

[tool.ruff.lint]
# Pinned so a new ruff default set cannot change the verdict of a release.
select = ["E4", "E7", "E9", "F", "I"]

[tool.pytest.ini_options]
pythonpath = ["src"]
# TestResult from the contract is data, not a test case: collect functions only.
python_classes = []
